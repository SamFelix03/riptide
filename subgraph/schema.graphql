type Protocol @entity(immutable: false) {
  id: ID!
  chainId: BigInt!
  aqua: Bytes!
  swapRouter: Bytes!
  rebalanceRouter: Bytes!
  batchExecutor: Bytes!
  settler: Bytes!
  quoter: Bytes!
  lens: Bytes!
  totalFillVolume: BigInt!
  totalRecapture: BigInt!
  fillCount: BigInt!
  rebalanceCount: BigInt!
}

type Token @entity(immutable: false) {
  id: ID!
  symbol: String!
  decimals: Int!
}

type Market @entity(immutable: false) {
  id: ID!
  baseToken: Token!
  quoteToken: Token!
  fillVolume: BigInt!
  recaptureVolume: BigInt!
  strategies: [Strategy!]! @derivedFrom(field: "market")
}

type Maker @entity(immutable: false) {
  id: ID!
  fillVolume: BigInt!
  recaptureVolume: BigInt!
  strategies: [Strategy!]! @derivedFrom(field: "maker")
}

type StrategyKeyIndex @entity(immutable: false) {
  id: ID!
  strategy: Strategy!
}

type Strategy @entity(immutable: false) {
  id: ID!
  strategyKey: Bytes!
  strategyHash: Bytes!
  maker: Maker!
  market: Market!
  reserveBaseWad: BigInt!
  reserveQuoteWad: BigInt!
  aquaBase: BigInt!
  aquaQuote: BigInt!
  docked: Boolean!
  lastVersion: BigInt!
  """
  Raw `abi.encode(ISwapVM.Order)` captured from Aqua's `Shipped` event. The order's
  `data` field is the 226-byte RIPTIDE payload followed by the SwapVM program, so this
  is the only place a strategy's fee/auction policy and salt can be recovered from —
  Aqua exposes balance getters only, and the routers do not store the policy. The
  solver decodes it to make maker-shipped strategies routable.
  """
  orderBytes: Bytes
  fills: [Fill!]! @derivedFrom(field: "strategy")
  rebalances: [Rebalance!]! @derivedFrom(field: "strategy")
  controllerStates: [ControllerState!]! @derivedFrom(field: "strategy")
}

type ControllerState @entity(immutable: true) {
  id: ID!
  strategy: Strategy!
  sigmaWad: BigInt!
  feeTarget: Int!
  feeReported: Int!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type Fill @entity(immutable: true) {
  id: ID!
  route: Route
  strategy: Strategy!
  market: Market!
  maker: Maker!
  tokenIn: Bytes!
  tokenOut: Bytes!
  amountIn: BigInt!
  amountOut: BigInt!
  feeBpsApplied: Int!
  sigmaWad: BigInt!
  reserveBaseAfterWad: BigInt!
  reserveQuoteAfterWad: BigInt!
  versionAfter: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type Rebalance @entity(immutable: false) {
  id: ID!
  strategy: Strategy!
  market: Market!
  maker: Maker!
  """The VM taker credited by the router - the settler contract on the settler path."""
  resolver: Bytes!
  """The address that actually funded the settlement and kept the rebate. Equals
  `resolver` when the rebalance was settled directly against the router."""
  settledBy: Bytes!
  tokenIn: Bytes!
  tokenOut: Bytes!
  executedInWad: BigInt!
  staleInWad: BigInt!
  surplusWad: BigInt!
  retainToLPWad: BigInt!
  payToResolverWad: BigInt!
  revealedPriceWad: BigInt!
  versionAfter: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type Route @entity(immutable: true) {
  id: ID!
  market: Market!
  payer: Bytes!
  recipient: Bytes!
  kind: Int!
  tokenIn: Bytes!
  tokenOut: Bytes!
  amountIn: BigInt!
  amountOut: BigInt!
  limit: BigInt!
  fillCount: Int!
  fills: [Fill!]! @derivedFrom(field: "route")
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type MarketSnapshot @entity(immutable: false) {
  id: ID!
  market: Market!
  bucketStart: BigInt!
  fillVolume: BigInt!
  recaptureVolume: BigInt!
  fillCount: BigInt!
}

"""Per-address resolver attribution, aggregated from `RiptideAuctionSettler.AuctionSettled`."""
type Resolver @entity(immutable: false) {
  id: ID!
  settlementCount: BigInt!
  paidToResolverWad: BigInt!
  retainedForLPsWad: BigInt!
  amountInWad: BigInt!
  outWad: BigInt!
  firstSeenTimestamp: BigInt!
  lastSeenTimestamp: BigInt!
}

"""Internal join: lets the settler handler find the Rebalance the router wrote earlier in
the same transaction. Keyed by `txHash-strategyKey`, so concurrent settles never collide."""
type RebalanceTxIndex @entity(immutable: false) {
  id: ID!
  rebalance: String!
}
