name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contracts:
    name: forge build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: Types compile tests
        working-directory: contracts
        run: forge test --match-contract TypesCompile -vvv
      - name: Differential vector tests
        working-directory: contracts
        run: forge test --match-contract Differential -vvv
      - name: Math fuzz tests
        working-directory: contracts
        run: forge test --match-contract MathFuzz -vvv
      - name: Codec and MakerTraits freeze tests
        working-directory: contracts
        run: forge test --match-contract "RiptideStrategyCodec|MakerTraitsFreeze" -vvv
      - name: Volatility oracle tests
        working-directory: contracts
        run: forge test --match-contract RiptideVolatilityOracle -vvv
      - name: LVR fee provider tests
        working-directory: contracts
        run: forge test --match-contract RiptideLvrFeeProvider -vvv
      - name: Rebalance kernel tests
        working-directory: contracts
        run: forge test --match-contract RiptideRebalanceKernel -vvv
      - name: Opcode index, EIP-170 size, and router layout tests
        working-directory: contracts
        run: forge test --match-contract "OpcodeIndexProbe|DeploySize|RiptideSwapVMRouter|RiptideRebalanceInstruction" -vvv
      - name: Mechanism 1/2 and SwapVM invariant tests
        working-directory: contracts
        run: forge test --match-contract "Mechanism1|Mechanism2|SwapVMInvariants|Reentrancy" -vvv
      - name: Loop (Gate 6) tests
        working-directory: contracts
        run: forge test --match-contract LoopTest -vvv
      - name: Invariant suite (V1-V5)
        working-directory: contracts
        run: forge test --match-path "test/invariant/**" -vvv
      - name: Runtime unit tests
        working-directory: contracts
        run: forge test --match-path "test/unit/Runtime*" -vvv
      - name: Aqua lifecycle tests
        working-directory: contracts
        run: forge test --match-contract "AquaPushPull|AquaDock|RebalanceAuth" -vvv
      - name: Periphery (Gate 7) tests
        working-directory: contracts
        run: forge test --match-contract "RiptideQuoter|RiptideLens|AuctionSettler|BatchExecutor|QuoterRebalancePreview" -vvv

  typescript:
    name: pnpm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm -w build
      - run: pnpm --filter @riptide/riptide-math test
      - run: pnpm --filter @riptide/strategy-sdk test

  reference:
    name: python unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install keccak for payload vectors
        run: pip install pycryptodome
      - name: Run reference model tests
        run: python -m unittest tools.reference.test_reference_math -v
      - name: Verify committed vectors
        run: python -m tools.reference.generate_vectors --check
      - name: Verify committed payload vectors
        run: python -m tools.reference.generate_payload_vectors --check

  fork:
    name: fork smoke test
    runs-on: ubuntu-latest
    if: ${{ secrets.RPC_URL_TARGET != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run Provenance fork test
        working-directory: contracts
        env:
          RPC_URL_TARGET: ${{ secrets.RPC_URL_TARGET }}
        run: forge test --match-path test/fork/Provenance.t.sol -vvv
