name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contracts:
    name: forge build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: Differential vector tests
        working-directory: contracts
        run: forge test --match-contract Differential -vvv
      - name: Math fuzz tests
        working-directory: contracts
        run: forge test --match-contract Fuzz -vvv
      - name: Strategy codec tests
        working-directory: contracts
        run: forge test --match-contract RiptideStrategyCodec -vvv
      - name: MakerTraits freeze tests
        working-directory: contracts
        run: forge test --match-contract MakerTraitsFreeze -vvv
      - name: Volatility oracle tests
        working-directory: contracts
        run: forge test --match-contract RiptideVolatilityOracle -vvv
      - name: Fee provider tests
        working-directory: contracts
        run: forge test --match-contract RiptideLvrFeeProvider -vvv
      - name: Rebalance kernel tests
        working-directory: contracts
        run: forge test --match-contract RiptideRebalanceKernel -vvv
      - name: Router unit tests
        working-directory: contracts
        run: forge test --match-contract "RiptideSwapVMRouter|RiptideRebalanceInstruction|OpcodeIndexProbe|DeploySize" -vvv
      - name: Invariant suite (V1-V5)
        working-directory: contracts
        run: forge test --match-path "test/invariant/**" -vvv
      - name: Runtime unit tests
        working-directory: contracts
        run: forge test --match-path "test/unit/Runtime*" -vvv
      - name: Periphery contract tests
        working-directory: contracts
        run: forge test --match-contract "RiptideQuoter|RiptideBatch|RiptideLens|RiptideAuction" -vvv
      - name: Bytecode size check
        working-directory: contracts
        run: forge test --match-contract DeploySizeTest -vvv
      - name: Demo token unit tests
        working-directory: contracts
        run: forge test --match-contract RiptideDemoToken -vvv
      - name: Deploy/seed script tests
        working-directory: contracts
        run: forge test --match-path "test/script/**" -vvv

  anvil-deploy:
    name: anvil deploy + seed + manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Start Anvil
        run: anvil --chain-id 31337 --code-size-limit 100000 --port 8545 &
      - name: Wait for Anvil
        run: sleep 2
      - name: Deploy Riptide stack
        working-directory: contracts
        run: |
          forge script script/deploy.s.sol:DeployScript --broadcast \
            --rpc-url http://127.0.0.1:8545 \
            --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            --code-size-limit 100000 \
            --legacy
      - name: Seed demo strategies
        working-directory: contracts
        run: |
          forge script script/seed.s.sol:SeedScript --broadcast \
            --rpc-url http://127.0.0.1:8545 \
            --private-keys 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            --private-keys 0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d \
            --private-keys 0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a \
            --private-keys 0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6 \
            --code-size-limit 100000 \
            --legacy
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @riptide/contracts build
      - run: pnpm --filter @riptide/contracts validate-manifest deployments/31337.json
      - name: Service integration tests
        env:
          RPC_URL: http://127.0.0.1:8545
          CHAIN_ID: "31337"
          CI: "true"
          GOVERNED_INDEXER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          SUBGRAPH_URL: ${{ secrets.SUBGRAPH_URL }}
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
        run: |
          pnpm -w build
          pnpm --filter @riptide/solver-core test
          pnpm --filter @riptide/solver-api test
          pnpm --filter @riptide/resolver-core test
          pnpm --filter @riptide/resolver-bot test
          pnpm --filter @riptide/vol-indexer test
          pnpm --filter @riptide/liquidity-mcp test
      - name: Subgraph discovery parity (optional)
        if: ${{ secrets.SUBGRAPH_URL != '' }}
        env:
          RPC_URL: http://127.0.0.1:8545
          CHAIN_ID: "31337"
          CI: "true"
          SUBGRAPH_URL: ${{ secrets.SUBGRAPH_URL }}
        run: pnpm --filter @riptide/solver-core test

  subgraph:
    name: subgraph matchstick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Subgraph codegen and tests
        working-directory: subgraph
        run: |
          pnpm run codegen
          pnpm run test

  typescript:
    name: pnpm build + package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm -w build
      - run: pnpm --filter @riptide/contracts codegen:check
      - run: pnpm --filter @riptide/contracts validate-manifest deployments/31337.json
      - run: pnpm --filter @riptide/contracts validate-manifest deployments/84532.json
      - run: pnpm --filter @riptide/contracts test
      - run: pnpm --filter @riptide/riptide-math test
      - run: pnpm --filter @riptide/strategy-sdk test
      - run: pnpm --filter @riptide/solver-core test
      - run: pnpm --filter @riptide/resolver-core test
      - run: pnpm --filter @riptide/frontend-api test
      - run: pnpm --filter @riptide/web test

  web-e2e:
    name: web Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm -w build
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium
      - name: E2E tests
        env:
          CI: "true"
        run: pnpm --filter @riptide/web test:e2e

  address-audit:
    name: hardcoded address grep audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install
      - run: pnpm --filter @riptide/contracts build
      - run: node tools/audit/hardcoded-addresses.mjs

  reference:
    name: python unittest + vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run reference model tests
        run: python -m unittest discover tools/reference -v
      - name: Verify committed vectors
        run: python -m tools.reference.generate_vectors --check
      - name: Verify payload vectors
        run: python -m tools.reference.generate_payload_vectors --check

  fork:
    name: fork integration tests
    runs-on: ubuntu-latest
    if: ${{ secrets.RPC_URL_TARGET != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run fork gate tests
        working-directory: contracts
        env:
          RPC_URL_TARGET: ${{ secrets.RPC_URL_TARGET }}
        run: |
          forge test --match-path test/fork/Provenance.t.sol -vvv
          forge test --match-path "test/fork/**" -vvv
          forge test --match-contract LoopTest -vvv
