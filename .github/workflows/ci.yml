name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contracts:
    name: forge build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: Types compile tests
        working-directory: contracts
        run: forge test --match-contract TypesCompile -vvv
      - name: Differential vector tests
        working-directory: contracts
        run: forge test --match-contract Differential -vvv
      - name: Math fuzz tests
        working-directory: contracts
        run: forge test --match-contract MathFuzz -vvv
      - name: Codec and MakerTraits freeze tests
        working-directory: contracts
        run: forge test --match-contract "RiptideStrategyCodec|MakerTraitsFreeze" -vvv
      - name: Volatility oracle tests
        working-directory: contracts
        run: forge test --match-contract RiptideVolatilityOracle -vvv
      - name: LVR fee provider tests
        working-directory: contracts
        run: forge test --match-contract RiptideLvrFeeProvider -vvv
      - name: Rebalance kernel tests
        working-directory: contracts
        run: forge test --match-contract RiptideRebalanceKernel -vvv
      - name: Opcode index, EIP-170 size, and router layout tests
        working-directory: contracts
        run: forge test --match-contract "OpcodeIndexProbe|DeploySize|RiptideSwapVMRouter|RiptideRebalanceInstruction" -vvv
      - name: Mechanism 1/2 and SwapVM invariant tests
        working-directory: contracts
        run: forge test --match-contract "Mechanism1|Mechanism2|SwapVMInvariants|Reentrancy" -vvv
      - name: Loop (Gate 6) tests
        working-directory: contracts
        run: forge test --match-contract LoopTest -vvv
      - name: Invariant suite (V1-V5)
        working-directory: contracts
        run: forge test --match-path "test/invariant/**" -vvv
      - name: Runtime unit tests
        working-directory: contracts
        run: forge test --match-path "test/unit/Runtime*" -vvv
      - name: Aqua lifecycle tests
        working-directory: contracts
        run: forge test --match-contract "AquaPushPull|AquaDock|RebalanceAuth" -vvv
      - name: Periphery (Gate 7) tests
        working-directory: contracts
        run: forge test --match-contract "RiptideQuoter|RiptideLens|AuctionSettler|BatchExecutor|QuoterRebalancePreview" -vvv
      - name: Demo token and deploy/seed scripts
        working-directory: contracts
        run: forge test --match-contract "RiptideDemoToken|DeploySeed" -vvv

  typescript:
    name: pnpm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build Solidity artifacts for ABI codegen
        working-directory: contracts
        run: forge build
      - run: pnpm install
      - run: pnpm -w build
      - run: pnpm --filter @riptide/contracts codegen:check
      - run: pnpm --filter @riptide/contracts validate-manifest deployments/31337.example.json
      - run: pnpm --filter @riptide/contracts test
      - run: pnpm --filter @riptide/riptide-math test
      - run: pnpm --filter @riptide/strategy-sdk test
      - run: pnpm --filter @riptide/solver-core test
      - run: pnpm --filter @riptide/solver-api test
      - run: pnpm --filter @riptide/resolver-core test
      - run: pnpm --filter @riptide/resolver-bot test
      - run: pnpm --filter @riptide/vol-indexer test
      - run: pnpm --filter @riptide/liquidity-mcp test
      - run: pnpm --filter @riptide/frontend-api test

  reference:
    name: python unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install keccak for payload vectors
        run: pip install pycryptodome
      - name: Run reference model tests
        run: python -m unittest tools.reference.test_reference_math -v
      - name: Verify committed vectors
        run: python -m tools.reference.generate_vectors --check
      - name: Verify committed payload vectors
        run: python -m tools.reference.generate_payload_vectors --check
      - name: Validate deployment manifest schema
        run: python -m tools.validate_manifest deployments/31337.example.json
      - name: Manifest schema tests
        run: python -m unittest tools.reference.test_manifest_schema -v

  subgraph:
    name: subgraph matchstick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts for ABI extract
        working-directory: contracts
        run: forge build
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Subgraph codegen and tests
        working-directory: subgraph
        run: |
          pnpm run abis
          pnpm run codegen
          pnpm run test

  anvil-deploy:
    name: anvil deploy + seed + manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Start Anvil
        run: anvil --chain-id 31337 --port 8545 &
      - name: Wait for Anvil
        run: sleep 2
      - name: Deploy Riptide stack
        working-directory: contracts
        run: |
          forge script script/deploy.s.sol:DeployScript --broadcast \
            --rpc-url http://127.0.0.1:8545 \
            --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            --legacy
      - name: Seed demo strategies
        working-directory: contracts
        run: |
          forge script script/seed.s.sol:SeedScript --broadcast \
            --rpc-url http://127.0.0.1:8545 \
            --private-keys 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            --private-keys 0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d \
            --private-keys 0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a \
            --private-keys 0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6 \
            --legacy
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @riptide/contracts build
      - run: pnpm --filter @riptide/contracts validate-manifest deployments/31337.json
      - run: pnpm --filter @riptide/solver-api... build
      - run: pnpm --filter @riptide/resolver-bot... build
      - run: pnpm --filter @riptide/vol-indexer... build
      - run: pnpm --filter @riptide/liquidity-mcp... build
      - run: pnpm --filter @riptide/frontend-api... build
      - name: Solver, resolver, vol-indexer, liquidity-mcp, and frontend-api against Anvil
        env:
          RPC_URL: http://127.0.0.1:8545
          CHAIN_ID: "31337"
          GOVERNED_INDEXER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
        run: |
          pnpm --filter @riptide/solver-core test
          pnpm --filter @riptide/solver-api test
          pnpm --filter @riptide/resolver-core test
          pnpm --filter @riptide/resolver-bot test
          pnpm --filter @riptide/vol-indexer test
          pnpm --filter @riptide/liquidity-mcp test
          pnpm --filter @riptide/frontend-api test

  fork:
    name: fork smoke test
    runs-on: ubuntu-latest
    if: ${{ secrets.RPC_URL_TARGET != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run Provenance fork test
        working-directory: contracts
        env:
          RPC_URL_TARGET: ${{ secrets.RPC_URL_TARGET }}
        run: forge test --match-path test/fork/Provenance.t.sol -vvv
